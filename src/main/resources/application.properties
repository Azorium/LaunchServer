spring.config.import=optional:file:.env.properties

# Сервер
server.port=${SERVER_PORT}

# App
app.skin_api_url=${SKIN_API_URL}
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS}

# Multipart
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# Логирование
logging.pattern.console=${LOGGING_PATTERN_CONSOLE}
logging.file.name=${LOGGING_FILE_NAME}

# Datasource
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME}

# HikariCP
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME}
spring.datasource.hikari.connection-test-query=${HIKARI_CONNECTION_TEST_QUERY}
spring.datasource.hikari.auto-commit=${HIKARI_AUTO_COMMIT}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=${JPA_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${JPA_HIBERNATE_FORMAT_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}